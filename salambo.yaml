version: 1
name: salambo-agent-template
runtime: pi

image:
  mode: managed

agent:
  name: Salambo Agent Template
  slug: salambo-agent-template
  description: General-purpose managed Pi agent.
  icon: 🤖
  isActive: true

runtimeConfig:
  egressPolicyMode: restricted
  egressAllowlist: []
  workspaceUpgradePolicy: automatic

env: {}

secrets:
  OPENAI_API_KEY:
    fromEnv: OPENAI_API_KEY
    description: OpenAI provider key.
    exposeTo:
      - runtime
