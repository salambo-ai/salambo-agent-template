name: Template contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Salambo CLI
        run: npm install --global salambo@0.3.4

      - name: Validate Pi project source contract
        run: node scripts/validate-template.mjs
