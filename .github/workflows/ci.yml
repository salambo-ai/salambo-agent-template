name: Template contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Salambo CLI from the matching platform branch
        run: |
          git clone --depth 1 --branch codex/sal-394-owned-pi-projects https://github.com/salambo-ai/salambo_app.git /tmp/salambo-app
          corepack enable
          cd /tmp/salambo-app
          pnpm install --frozen-lockfile
          pnpm --filter salambo build
          npm install --global ./packages/cli

      - name: Validate managed template contract
        run: node scripts/validate-template.mjs
